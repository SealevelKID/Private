name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 設定全域環境變數，解決 2026 年的 Node.js 棄用警告與時區同步
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Taipei  # 強制指定虛擬主機為台灣時區
  MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          # 重新啟用快取，因為現在有 requirements.txt 可以對照了
          cache: 'pip' 

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          # 讓機器人直接讀取你的 requirements.txt 來安裝所有套件
          pip install -r requirements.txt

      - name: 執行資料抓取與分析
        run: |
          python fetch_and_analyze.py
          python gift_fetcher.py

      - name: 自動提交更新資料
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_data.json rejected_stocks.json
          if git diff --staged --quiet; then
            echo "資料無變更，跳過 Commit"
          else
            git commit -m "📈 自動更新股票資料: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 部署至 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 發布部署
        uses: actions/deploy-pages@v5

      - name: 發送 Telegram 通知
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ env.TELEGRAM_CHAT_ID }} \
          -d text="✅ 股票資料已完成自動抓取與更新！"

      - name: 發送 Telegram 失敗通知
        if: failure()  # 🚨 關鍵：只要前面有任何一個步驟報錯中斷，就會強制觸發這步
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ env.TELEGRAM_CHAT_ID }} \
          -d text="🚨 警告：股票資料自動更新失敗，請檢查 GitHub Actions 紀錄！"
