name: Daily Stock Data Update

on:
  schedule:
    # 星期六中午 12 點 (12:00 TW) -> 星期六早上 4 點 (04:00 UTC)
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 設定全域環境變數，解決 2026 年的 Node.js 棄用警告與時區同步
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Taipei  # 強制指定虛擬主機為台灣時區
  MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 披上隱形斗篷 (隨機等待 30~60 分鐘)
        if: github.event_name == 'schedule'  # 🆕 只有在週末定時排程觸發時才休眠；手動點擊會直接跳過此步驟
        run: |
          # 產生 1800 秒 (30 分鐘) 到 3600 秒 (60 分鐘) 的亂數
          WAIT_TIME=$((1800 + RANDOM % 1801))
          WAIT_MINS=$((WAIT_TIME / 60))
          echo "⏳ 模擬人類作息，隨機等待 $WAIT_TIME 秒 (約 $WAIT_MINS 分鐘) 後再開始執行..."
          sleep $WAIT_TIME

      - name: 執行資料抓取與分析
        run: |
          python fetch_and_analyze.py
          python gift_fetcher.py

      - name: 自動提交更新資料
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_data.json rejected_stocks.json
          if git diff --staged --quiet; then
            echo "資料無變更，跳過 Commit"
          else
            git commit -m "📈 自動更新股票資料: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 部署至 GitHub Pages
        uses: actions/upload-pages-artifact@v5   # 升級到 v5 完美對接 Node 24
        with:
          path: '.'

      - name: 發布部署
        uses: actions/deploy-pages@v5

      - name: 發送 Telegram 通知
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ env.TELEGRAM_CHAT_ID }} \
          -d text="✅ 股票資料已完成自動抓取與更新！"

      - name: 發送 Telegram 失敗通知與報錯連結
        if: failure()
        run: |
          # 提取 GitHub Actions 的專屬日誌連結
          ERROR_LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 將連結一併發送至 Telegram
          curl -s -X POST https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ env.TELEGRAM_CHAT_ID }} \
          -d text="🚨 警告：股票資料自動更新失敗！%0A%0A可能是遇到證交所維護或遭到阻擋。%0A👉 點此直接查看詳細報錯紀錄：%0A$ERROR_LOG_URL"
